# This repository is public. The git hooks stop private content before it leaves a machine;
# this is the backstop on GitHub. Its logs are public too, so neither scanner prints what it found.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # a pull request's own commits, not the merge commit GitHub makes for it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Public rules on every file, commit identity and message
        run: node cli/guard/public-guard.mjs --all --ci
      - name: Gitleaks on the whole history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba detect --source /repo --redact --no-banner -v

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
